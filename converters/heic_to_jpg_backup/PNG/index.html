<!-- HEIC → JPG/PNG 변환기 (브라우저에서 변환) -->
<div style="background:#1e1e1e;padding:20px;border-radius:12px;color:#eee;font-family:'Noto Sans',system-ui,Segoe UI,Roboto,'Noto Sans KR',sans-serif;max-width:460px;margin:30px auto;text-align:center;box-shadow:0 0 10px rgba(0,0,0,.4);position:relative;">
<h3 style="margin-bottom:12px;font-weight:600;color:#fff;" data-ke-size="size23">HEIC → JPG 변환</h3>

<div id="heicToast" role="status" aria-live="polite"
  style="display:none;position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:2;padding:8px 12px;border-radius:999px;font-size:12px;line-height:1.35;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.06);color:#cbd5e1;width:calc(100% - 40px);max-width:420px;box-sizing:border-box;text-align:center;backdrop-filter:blur(8px);pointer-events:none;"
></div>

<input id="heicInput"
style="margin:12px 0;padding:8px;background:#2a2a2a;color:#ccc;border:1px solid #444;border-radius:6px;width:90%;"
accept=".heic,.heif,image/heic,image/heif"
type="file" />

<div style="margin:8px 0 4px;font-size:12px;color:#aaa;">HEIC/HEIF (권장 10MB 이하)</div>

<div style="display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px;flex-wrap:wrap;">
<select id="outFormat" style="padding:10px 12px;border-radius:8px;border:1px solid #444;background:#2a2a2a;color:#eee;">
<option value="jpeg" selected>JPG</option>
<option value="png">PNG(투명 유지)</option>
</select>

<label style="font-size:12px;color:#aaa;display:flex;align-items:center;gap:8px;">
  품질
  <input id="quality" type="range" min="0.5" max="1" step="0.05" value="0.92" />
  <span id="qVal" style="min-width:38px;text-align:left;">0.92</span>
</label>

</div>

<div style="display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;margin-top:12px;">
  <button id="heicConvertBtn"
  type="button"
  style="padding:10px 20px;margin:0;border:none;border-radius:10px;background:#444;color:#fff;cursor:pointer;transition:.2s;min-width:220px;">
  변환하기
  </button>

  <a id="heicDownload"
    style="display:none; padding:11px 22px; background:#3b82f6; color:#fff;
           border-radius:10px; text-decoration:none; font-size:14px; justify-content:center; align-items:center; min-width:220px;"
  ></a>
</div>

 <p id="heicStatus"
    style="margin:10px 0 0; font-size:13px; color:#aaa; white-space:pre-line;
           padding:0; border-radius:10px; background:transparent; border:1px solid transparent;"
    data-ke-size="size16">&nbsp;</p>
</div>

<!-- 사용 방법 (하단 안내 박스) -->
<div style="background:#1f1f1f;border:1px solid #2c2c2c;padding:22px;border-radius:12px;color:#f5f5f5;font-family:'Noto Sans',system-ui,Segoe UI,Roboto,'Noto Sans KR',sans-serif;max-width:460px;margin:24px auto 40px;text-align:left;box-shadow:0 10px 22px rgba(0,0,0,.35);">
<h4 style="margin:0 0 14px;font-weight:600;color:#fff;font-size:16px;" data-ke-size="size20">사용 방법</h4>
<div style="display:flex;flex-direction:column;gap:12px;">
<div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;color:#e8ebf2;">
<b>1. HEIC/HEIF 선택</b><br/>
변환할 HEIC(또는 HEIF) 파일을 “파일 선택”으로 업로드하세요.
</div>
<div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;color:#e8ebf2;">
<b>2. 옵션 설정</b><br/>
출력 형식(JPG/PNG)을 고르고, JPG라면 품질(퀄리티)도 조절할 수 있어요.
</div>
<div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;color:#e8ebf2;">
<b>3. 변환 · 다운로드</b><br/>
“변환하기”를 누른 뒤, 완료되면 아래 “다운로드” 버튼으로 저장하세요.
</div>
</div>
<div style="height:8px;"></div>
<div style="font-size:12px;color:#9ca3af;" data-ke-size="size16">
팁: 투명이 필요하면 PNG를 추천해. (JPG는 투명 배경을 못 담아)
</div>
</div>
<!-- heic2any (CDN) -->
<script src="https://unpkg.com/heic2any/dist/heic2any.min.js"></script>

<script>
(function () {
const inputEl = document.getElementById('heicInput');
const btn = document.getElementById('heicConvertBtn');
const statusEl = document.getElementById('heicStatus');
const linkEl = document.getElementById('heicDownload');
const toastEl = document.getElementById('heicToast');
const outFormatEl = document.getElementById('outFormat');
const qEl = document.getElementById('quality');
const qVal = document.getElementById('qVal');

let currentUrl = null;
let toastTimer = null;
const TOAST_MS = 4000;

 function setStatus(text, variant) {
   statusEl.textContent = text || '';
   statusEl.hidden = !text;

   // reset
   statusEl.style.color = '#aaa';
   statusEl.style.background = 'transparent';
   statusEl.style.borderColor = 'transparent';
   statusEl.style.padding = '0';

   if (!text) return;
   statusEl.hidden = false;

   if (variant === 'success') {
     statusEl.style.color = '#4ade80';
     statusEl.style.background = 'rgba(74, 222, 128, 0.10)';
     statusEl.style.borderColor = 'rgba(74, 222, 128, 0.22)';
     statusEl.style.padding = '10px 12px';
   } else if (variant === 'error') {
     statusEl.style.color = '#f87171';
     statusEl.style.background = 'rgba(248, 113, 113, 0.10)';
     statusEl.style.borderColor = 'rgba(248, 113, 113, 0.22)';
     statusEl.style.padding = '10px 12px';
   } else {
     // info
     statusEl.style.color = '#9ca3af';
     statusEl.style.background = 'transparent';
     statusEl.style.borderColor = 'transparent';
     statusEl.style.padding = '0';
   }
 }

function hideToast() {
  if (toastTimer) {
    clearTimeout(toastTimer);
    toastTimer = null;
  }
  toastEl.hidden = true;
  toastEl.style.display = 'none';
  toastEl.textContent = '';
}

function showToast(text, variant) {
  hideToast();
  toastEl.textContent = text || '';
  toastEl.hidden = !text;
  if (!text) return;

  // reset
  toastEl.style.color = '#cbd5e1';
  toastEl.style.background = 'rgba(255, 255, 255, 0.04)';
  toastEl.style.borderColor = 'rgba(255, 255, 255, 0.06)';

  if (variant === 'success') {
    toastEl.style.color = '#4ade80';
    toastEl.style.background = 'rgba(74, 222, 128, 0.10)';
    toastEl.style.borderColor = 'rgba(74, 222, 128, 0.22)';
  } else if (variant === 'error') {
    toastEl.style.color = '#f87171';
    toastEl.style.background = 'rgba(248, 113, 113, 0.10)';
    toastEl.style.borderColor = 'rgba(248, 113, 113, 0.22)';
  }

  toastEl.style.display = 'inline-block';
  toastTimer = setTimeout(hideToast, TOAST_MS);
}

function hideDownload() {
linkEl.hidden = true;
linkEl.style.display = 'none';
linkEl.removeAttribute('href');
linkEl.removeAttribute('download');
linkEl.textContent = '';
}

function revokeUrl() {
if (currentUrl) URL.revokeObjectURL(currentUrl);
currentUrl = null;
}

qEl.addEventListener('input', () => {
qVal.textContent = Number(qEl.value).toFixed(2);
});

hideDownload();
hideToast();
setStatus('');

btn.addEventListener('click', async () => {
const file = inputEl.files && inputEl.files[0];
if (!file) {
alert('HEIC/HEIF 파일을 선택해주세요.');
return;
}

if (typeof window.heic2any !== 'function') {
  hideDownload();
  setStatus('변환 라이브러리를 불러오지 못했어요. (CDN 차단/CSP/네트워크 확인)', 'error');
  showToast('변환 라이브러리를 불러오지 못했어요. (CDN 차단/CSP/네트워크 확인)', 'error');
  alert('heic2any 로딩 실패: 네트워크 또는 보안정책(CSP) 때문에 스크립트가 차단됐을 수 있어요.');
  return;
}

// 타입이 비어있는 경우(일부 브라우저) 대비해서 확장자도 체크
const nameOk = /\.(heic|heif)$/i.test(file.name || '');
const typeOk = /^image\/(heic|heif)$/i.test(file.type || '');
if (!nameOk && !typeOk) {
  alert('HEIC/HEIF 파일만 지원합니다.');
  return;
}

// 용량 제한(원하면 조절)
if (file.size > 10 * 1024 * 1024) {
  alert('파일 크기는 10MB 이하를 권장합니다.');
  return;
}

hideDownload();
hideToast();
revokeUrl();
btn.disabled = true;
setStatus('파일을 불러오는 중…', 'info');

try {
  const out = outFormatEl.value; // 'jpeg' or 'png'
  const quality = Math.max(0.5, Math.min(1, Number(qEl.value)));

  setStatus('HEIC 변환 중…', 'info');

  // heic2any: HEIC -> Blob
  const resultBlob = await heic2any({
    blob: file,
    toType: out === 'png' ? 'image/png' : 'image/jpeg',
    quality: out === 'png' ? 1 : quality
  });

  // heic2any가 단일/배열로 올 수 있음
  const blob = Array.isArray(resultBlob) ? resultBlob[0] : resultBlob;

  currentUrl = URL.createObjectURL(blob);
  linkEl.href = currentUrl;
  linkEl.download = (file.name || 'image').replace(/\.(heic|heif)$/i, '') + (out === 'png' ? '.png' : '.jpg');
  linkEl.textContent = '다운로드하기';
  linkEl.hidden = false;
  linkEl.style.display = 'flex';
  linkEl.style.alignItems = 'center';

  setStatus('');
  showToast('변환 완료! 아래 다운로드 버튼으로 저장하세요.', 'success');
} catch (e) {
  console.error(e);
  hideDownload();
  setStatus('변환 중 오류가 발생했어요.', 'error');
  showToast('변환 중 오류가 발생했어요.', 'error');
  alert('변환 실패: ' + (e && e.message ? e.message : e));
} finally {
  btn.disabled = false;
}

});
})();
</script>
